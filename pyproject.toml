# --------------------------------------------------------------------------- #
# rag_lab: paquete instalable. Necesario para LangGraph Studio: langgraph.json
# declara dependencies=["."], y `langgraph dev` instala el proyecto con pip
# para que studio/graphs.py pueda importar rag_lab.* desde cualquier ruta.
# --------------------------------------------------------------------------- #
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-lab"
version = "1.0.0"
description = "DocuAgent-RAG: laboratorio de benchmarking de pipelines RAG con meta-supervisor LangGraph, metrica hibrida anclada a juicio humano y agentes de analisis"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scikit-learn",
    "python-dotenv",
    "pydantic>=2",
    "langgraph",
    "langchain-core",
    "langchain-community",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-text-splitters",
    "faiss-cpu",
    "rank-bm25",
    "pypdf",
    "langchain-huggingface",
    "sentence-transformers",
]

[project.optional-dependencies]
extras = ["umap-learn", "torch", "voyageai", "langchain-voyageai",
          "langchain-experimental", "grandalf"]

[tool.setuptools.packages.find]
include = ["rag_lab*"]
